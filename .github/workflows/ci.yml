name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      # The SQL Server integration tests need a local instance; they run on developer machines.
      HASTANE_SKIP_SQL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    env:
      # Passed through the environment and checked before use, never expanded into the script.
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check tag name
        shell: pwsh
        run: |
          if ($env:REF_NAME -cnotmatch '^v[A-Za-z0-9._-]+$') { throw "Unsafe tag name for a file name." }
          "ARTIFACT=HastaneRandevu-$($env:REF_NAME)-win-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish
        run: dotnet publish src/HastaneRandevu.UI -c Release -r win-x64 --self-contained false -o publish
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md, README.tr.md, CHANGELOG.md, CHANGELOG.tr.md publish/
          Compress-Archive -Path publish/* -DestinationPath "$($env:ARTIFACT).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.zip
          if-no-files-found: error
