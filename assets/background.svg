<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="660" height="460">
  <!-- Abstract backdrop for the sign-in and registration screens. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4f1"/>
      <stop offset="0.55" stop-color="#cfe8ea"/>
      <stop offset="1" stop-color="#a9d3da"/>
    </linearGradient>
  </defs>
  <rect width="660" height="460" fill="url(#sky)"/>
  <circle cx="560" cy="80" r="190" fill="#1f8a8a" fill-opacity="0.10"/>
  <circle cx="90" cy="430" r="160" fill="#155e75" fill-opacity="0.08"/>
  <circle cx="420" cy="300" r="120" fill="#ffffff" fill-opacity="0.35"/>
  <g transform="translate(330 230)" fill="none" stroke="#155e75" stroke-linecap="round">
    <circle r="118" stroke-width="10" stroke-opacity="0.22"/>
    <circle r="96" stroke-width="3" stroke-opacity="0.18" stroke-dasharray="2 18"/>
    <line x1="0" y1="0" x2="0" y2="-70" stroke-width="12" stroke-opacity="0.28"/>
    <line x1="0" y1="0" x2="48" y2="28" stroke-width="12" stroke-opacity="0.28"/>
    <circle r="10" fill="#155e75" fill-opacity="0.28" stroke="none"/>
  </g>
  <g transform="translate(470 120)">
    <circle r="40" fill="#f07167" fill-opacity="0.85"/>
    <g stroke="#ffffff" stroke-width="11" stroke-linecap="round">
      <line x1="0" y1="-19" x2="0" y2="19"/>
      <line x1="-19" y1="0" x2="19" y2="0"/>
    </g>
  </g>
  <g fill="#155e75" fill-opacity="0.16">
    <rect x="70" y="70" width="120" height="16" rx="8"/>
    <rect x="70" y="98" width="84" height="16" rx="8"/>
    <rect x="470" y="360" width="120" height="16" rx="8"/>
    <rect x="506" y="388" width="84" height="16" rx="8"/>
  </g>
</svg>
