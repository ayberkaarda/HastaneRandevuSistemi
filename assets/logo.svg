      <stop offset="0" stop-color="#1f8a8a"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <circle cx="122" cy="134" r="78" fill="#ffffff"/>
  <circle cx="122" cy="134" r="64" fill="none" stroke="#155e75" stroke-width="6" stroke-opacity="0.18"/>
  <g stroke="#155e75" stroke-width="12" stroke-linecap="round">
    <line x1="122" y1="134" x2="122" y2="88"/>
    <line x1="122" y1="134" x2="154" y2="152"/>
  </g>
  <circle cx="122" cy="134" r="9" fill="#155e75"/>
  <circle cx="190" cy="66" r="42" fill="#f07167" stroke="#ffffff" stroke-width="8"/>
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round">
